name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Prepare wrappers
        run: chmod +x mvnw build.sh packaging/package.sh
      - name: Frontend tests
        run: npm --prefix frontend ci && npm --prefix frontend test
      - name: Frontend build
        run: npm --prefix frontend run build
      - name: Java build and tests
        run: ./mvnw -f backend/pom.xml -B install
      - name: Install Chromium for the browser smoke test
        run: npx --prefix frontend playwright install --with-deps chromium
      - name: Browser smoke test against the self-contained jar
        run: node frontend/e2e/smoke.cjs

  package:
    name: Package ${{ matrix.platform }}
    if: github.event_name != 'pull_request'
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows-x64
            command: ./packaging/package.ps1 -SkipTests
            shell: pwsh
          - os: macos-13
            platform: macos-x64
            command: bash packaging/package.sh --skip-tests
            shell: bash
          - os: macos-14
            platform: macos-arm64
            command: bash packaging/package.sh --skip-tests
            shell: bash
          - os: ubuntu-latest
            platform: linux-x64
            command: bash packaging/package.sh --skip-tests
            shell: bash
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Prepare wrappers
        if: runner.os != 'Windows'
        run: chmod +x mvnw build.sh packaging/package.sh
      - name: Build the app image
        shell: ${{ matrix.shell }}
        run: ${{ matrix.command }}
      - name: Upload the package
        uses: actions/upload-artifact@v4
        with:
          name: OpenDavki-${{ matrix.platform }}
          path: |
            target/package/*.zip
            target/package/*.tar.gz
            target/package/SHA256SUMS
          if-no-files-found: error
